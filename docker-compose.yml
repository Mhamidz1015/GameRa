services:
  gamera:
    image: ${DOCKER_REGISTRY-}gamera
    container_name: GameRa.Api
    build:
      context: .
      dockerfile: src/API/GameRa/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    depends_on:
      gamera.database:
        condition: service_healthy

  gamera.database:
    image: postgres:latest
    container_name: GameRa.Database
    environment:
      - POSTGRES_DB=GameRa
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./containers/db:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  gamera.identity:
    image: keycloak/keycloak:latest
    container_name: GameRa.Identity
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files:/opt/keycloak/data/import
    ports:
      - 18080:8080


  gamera.seq:
    image: datalust/seq:2024.3
    container_name: GameRa.Seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5341:5341
      - 8081:80

  gamera.redis:
    image: redis:latest
    container_name: GameRa.Redis
    restart: always
    ports:
      - 6379:6379
  
  gamera.minio:
    image: pgsty/minio:latest
    container_name: GameRa.Minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./.containers/minio:/data
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  gamera.minio.init:
    image: pgsty/minio:latest
    container_name: GameRa.Minio.Init
    depends_on:
      gamera.minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://gamera.minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/gamera-builds
      "

  gamera.rabbitmq:
    image: rabbitmq:3-management
    container_name: GameRa.RabbitMQ
    ports:
     - "5672:5672"
     - "15672:15672"